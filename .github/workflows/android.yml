name: Build Barca News APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: artifacts/barca-news
        env:
          PORT: 5173
          BASE_PATH: /
        run: pnpm run build

      - name: Sync Capacitor
        working-directory: artifacts/barca-news
        run: pnpm exec cap sync android

      - name: Build Release APK
        working-directory: artifacts/barca-news/android
        run: ./gradlew assembleRelease

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find artifacts/barca-news/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barca-News-APK
          path: artifacts/barca-news/android/**/*.apk
          if-no-files-found: error
